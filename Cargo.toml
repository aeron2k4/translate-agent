[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1"
textnorm = { path = "crates/textnorm" }
validators = { path = "crates/validators" }
telemetry = { path = "crates/telemetry" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Đường nóng không được panic vì unwrap; test thì được (xem clippy.toml).
unwrap_used = "deny"
