[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
regex = "1"
toml = "0.8"
axum = "0.8"
tokio-stream = "0.1"
# Chỉ rustls, không bật tính năng mặc định (không telemetry, không OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
textnorm = { path = "crates/textnorm" }
validators = { path = "crates/validators" }
telemetry = { path = "crates/telemetry" }
glossary = { path = "crates/glossary" }
client-core = { path = "crates/client-core" }
model-router = { path = "crates/model-router" }
prompts = { path = "crates/prompts" }
phrase-cache = { path = "crates/phrase-cache" }
translator = { path = "crates/translator" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Đường nóng không được panic vì unwrap; test thì được (xem clippy.toml).
unwrap_used = "deny"
