[project]
name = "xt-python"
version = "0.1.0"
description = "Công cụ ngoài đường nóng: quản trị glossary, review, eval, redteam"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Comment và chuỗi tiếng Việt dùng ký tự Unicode hợp lệ.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
