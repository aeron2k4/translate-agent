<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Translate Playground</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">X</span>
      <strong>Translate</strong>
      <span class="muted">playground</span>
    </div>
    <div class="topbar-right">
      <span class="pill" id="env-pill" title="Mô hình đang dùng">…</span>
      <button class="btn" id="btn-tools">Công cụ</button>
    </div>
  </header>

  <div class="workspace">
    <main id="stage" class="stage" aria-label="Các máy tham gia hội thoại"></main>
    <aside id="dev" class="dev" aria-label="Công cụ dev"></aside>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
